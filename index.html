  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

        <!-- Register Service Worker with update trigger -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('✅ SW registered:', reg.scope);
              
              // ── Check for updates every 60 seconds ──
              setInterval(() => {
                reg.update();
              }, 60000);
            })
            .catch((err) => console.log('❌ SW failed:', err));
        });
      }
    </script>

    <!-- Aggressive Popup Blocker for Embedded Iframes -->
    <script>
      (function() {
        // Block window.open from iframes
        const originalOpen = window.open;
        window.open = function(url, name, features) {
          try {
            if (window.self !== window.top) {
              console.log('🛑 Blocked popup from iframe:', url);
              return null;
            }
          } catch (e) {
            console.log('🛑 Blocked popup from cross-origin iframe:', url);
            return null;
          }
          return originalOpen.apply(this, arguments);
        };

        // Remove meta refresh redirects
        document.addEventListener('DOMContentLoaded', function() {
          const metaRefresh = document.querySelector('meta[http-equiv="refresh"]');
          if (metaRefresh) {
            console.log('🛑 Blocked meta refresh redirect');
            metaRefresh.remove();
          }
        });
      })();
    </script>
  </body>
